name: Windows 构建与发布

# 触发时机：推送到 main 验证构建健康；打 v* 标签自动发布 Release；也可手动运行
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # 固定 windows-2022：windows-latest 已迁移到 Windows Server 2025 镜像，
    # 不再预装 Visual Studio 2022，而本构建使用 "Visual Studio 17 2022" 生成器
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Qt 6.4.2 (MSVC 64 位)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.4.2"
          arch: win64_msvc2019_64
          cache: true

      - name: CMake 配置
        run: |
          cmake -S measurekit -B build -G "Visual Studio 17 2022" -A x64 -DMK_BUILD_TESTS=OFF -DMK_BUILD_SDK=OFF 2>&1 | Tee-Object -FilePath config.log
          exit $LASTEXITCODE

      - name: 配置失败时上报日志到提交评论
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('config.log') ? fs.readFileSync('config.log', 'utf8') : '(config.log 不存在)';
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: '❌ Windows CMake 配置失败日志（末尾）：\n\n```\n' + log.slice(-3500) + '\n```'
            });

      - name: 构建 Release
        run: cmake --build build --config Release

      - name: 安装 NSIS（CPack 生成 .exe 安装程序所需）
        run: choco install nsis --yes --no-progress

      - name: 打包（NSIS 安装程序 + ZIP 便携包）
        run: cmake --build build --target package --config Release

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: measurekit-windows
          path: |
            build/measurekit-*.exe
            build/measurekit-*.zip

      - name: 发布到 GitHub Releases（仅标签触发）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/measurekit-*.exe
            build/measurekit-*.zip
